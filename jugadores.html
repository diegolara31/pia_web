<body class="d-flex flex-column min-vh-100">
    <header>
        <nav class="navbar navbar-expand-lg navbar-dark">
            <div class="container">
                <a class="navbar-brand logo" href="pia.html">LOL</a>
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menuPrincipal" aria-controls="menuPrincipal" aria-expanded="false" aria-label="Mostrar navegación">

                    <ul class="navbar-nav ms-auto gap-lg-3">

                        <li class="nav-item"><a class="nav-link" href="login.html">Panel</a></li>
                    </ul>
                </div>
            </div>
        </nav>

    <main class="flex-grow-1">
        <section class="container pagina-titulo py-5 text-center">

        <section class="container filtros pb-4" aria-label="Filtrar jugadores por rol">
            <div class="d-flex flex-wrap justify-content-center gap-2">
                <button class="btn btn-filter activo" data-filtro="todos">Todos</button>
                <button class="btn btn-filter" data-filtro="asesino">Asesinos</button>

                <button class="btn btn-filter" data-filtro="mago">Magos</button>
                <button class="btn btn-filter" data-filtro="tirador">Tiradores</button>

                <button class="btn btn-filter" data-filtro="tanque">Tanques</button>
            </div>
        </section>

        <section class="container listado pb-5">
            <div class="row g-4" id="grid-jugadores"></div>
        </section>
    </main>

    <footer class="mt-auto">
        <p>Programacion Web Tercera OP</p>
