<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acceso al panel - LoL</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="pia.css">
</head>

<body class="d-flex flex-column min-vh-100">
    <header>
        <nav class="navbar navbar-expand-lg navbar-dark">
            <div class="container">
                <a class="navbar-brand logo" href="pia.html">LOL</a>
                <a class="nav-link" href="pia.html">Volver al inicio</a>
            </div>
        </nav>
    </header>

    <main class="flex-grow-1 d-flex align-items-center py-5">
        <section class="container">
            <div class="row justify-content-center">
                <div class="col-12 col-sm-10 col-md-7 col-lg-5 col-xl-4">
                    <div class="card carta login-card">
                        <div class="card-body p-4 p-sm-5">
                            <div class="text-center mb-4">
                                <span class="login-icon" aria-hidden="true">◆</span>
                                <h1 class="h2 section-title mt-3 mb-2">Acceso al panel</h1>
                                <p class="text-secondary mb-0">Administra el contenido de tu sitio</p>
                            </div>

                            <form id="form-login" novalidate>
                                <div class="mb-3">
                                    <label class="form-label" for="usuario">Usuario</label>
                                    <input class="form-control" type="text" id="usuario" name="usuario" autocomplete="username" required>
                                </div>
                                <div class="mb-3">
                                    <label class="form-label" for="password">Contraseña</label>
                                    <input class="form-control" type="password" id="password" name="password" autocomplete="current-password" required>
                                </div>

                                <div id="login-error" class="alert alert-danger d-none" role="alert"></div>
                                <button class="btn btn-primary w-100" type="submit">Iniciar sesión</button>
                            </form>

                        </div>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <footer class="mt-auto">
        <p>Programacion Web Tercera OP</p>
    </footer>

    <script src="js/datos.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/login.js"></script>
</body>
</html>
